[project]
name = "cgserver-ddns-client"
version = "0.1.0"
description = "ddns clint for cgserver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "distro>=1.9.0",
  "nvidia-ml-py>=12.570.86",
  "psutil>=7.0.0",
  "pydantic>=2.11.1",
  "pynvml>=12.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgserver_ddns_client"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[dependency-groups]
dev = []

[project.scripts]
cgserver-ddns-client = "cgserver_ddns_client.__main__:main"
cgserver-dump-info = "cgserver_ddns_client.clienttask:dump_info"
